    // Attach Chip Click Events for Chunk Analysis Modal
    function attachChipEvents() {
      document.querySelectorAll('.chunk-chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          openModal(
            chip.dataset.chunk,
            chip.dataset.role,
            chip.dataset.pos,
            chip.dataset.reason,
            chip.dataset.prompt
          );
        });
      });
    }

    // Open Modal
    function openModal(chunk, role, pos, reason, prompt) {
      modalChunkText.textContent = chunk;
      modalRoleBadge.textContent = role;
      modalPosDetail.textContent = pos;
      modalReason.textContent = reason;
      modalTeacherQuestion.textContent = prompt;

      componentDetailModal.classList.remove('hidden');
      setTimeout(() => {
        modalCard.classList.remove('scale-95', 'opacity-0');
        modalCard.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    // Close Modal
    function closeModal() {
      modalCard.classList.add('scale-95', 'opacity-0');
      modalCard.classList.remove('scale-100', 'opacity-100');
      setTimeout(() => {
        componentDetailModal.classList.add('hidden');
      }, 150);
    }

    closeModalBtn.onclick = closeModal;
    modalConfirmBtn.onclick = closeModal;
    componentDetailModal.onclick = (e) => {
      if (e.target === componentDetailModal) closeModal();
    };

    // Render Quiz Logic
    function renderQuiz(quiz) {
      const container = document.getElementById('quizContainerArea');
      if (!container || !quiz) return;

      container.innerHTML = `
        <p class="text-sm font-bold text-white mb-2 leading-relaxed">
          ${quiz.question}
        </p>
        <div class="p-2.5 bg-black/20 rounded-lg text-xs font-mono text-purple-200 mb-3 border border-white/5">
          ${quiz.sentenceText}
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="quizButtonsArea"></div>
        <div id="quizAnswerFeedback" class="hidden mt-3 p-3 rounded-xl text-xs leading-relaxed font-medium"></div>
      `;

      const buttonsArea = document.getElementById('quizButtonsArea');
      const feedback = document.getElementById('quizAnswerFeedback');

      quiz.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'p-2.5 bg-white/10 hover:bg-white/20 active:bg-white/30 border border-white/10 rounded-xl text-left text-xs font-semibold text-white transition';
        btn.textContent = `${idx + 1}. ${opt}`;
        btn.onclick = () => {
          feedback.classList.remove('hidden');
          if (idx === quiz.correctIndex) {
            feedback.className = 'mt-3 p-3 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-100 text-xs font-medium';
            feedback.innerHTML = `<strong>🎉 정답입니다! 완벽해요!</strong><br>${quiz.explanation}`;
          } else {
            feedback.className = 'mt-3 p-3 rounded-xl bg-rose-500/20 border border-rose-400/40 text-rose-100 text-xs font-medium';
            feedback.innerHTML = `<strong>다시 한번 생각해볼까요? 💡</strong><br>${quiz.explanation}`;
          }
        };
        buttonsArea.appendChild(btn);
      });
    }

    // Toggle Teacher Script Mode
    toggleTeacherModeBtn.onclick = () => {
      isTeacherModeOn = !isTeacherModeOn;
      const box = document.getElementById('teacherCueBox');
      if (isTeacherModeOn) {
        if (box) box.classList.remove('hidden');
        cueStatus.textContent = 'ON';
        cueStatus.className = 'font-bold text-xs bg-amber-200 text-amber-900 px-1.5 py-0.2 rounded-full ml-1';

      if (!isPenMode) return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      lastX = clientX - rect.left;
      lastY = clientY - rect.top;
    }

    function draw(e) {
      if (!isDrawing || !isPenMode) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const currentX = clientX - rect.left;
      const currentY = clientY - rect.top;

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(currentX, currentY);
      ctx.strokeStyle = penColor;
      ctx.lineWidth = penLineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      lastX = currentX;
      lastY = currentY;
    }

    function stopDrawing() {
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    togglePenBtn.onclick = () => {
      isPenMode = !isPenMode;
      if (isPenMode) {
        resizeCanvas();
        canvas.classList.remove('pointer-events-none');
        canvas.classList.add('pen-active');
        penToolbar.classList.remove('hidden');
        togglePenBtn.className = 'flex items-center space-x-1.5 px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-medium transition touch-action-manipulation shadow-xs';
      } else {
        canvas.classList.add('pointer-events-none');
        canvas.classList.remove('pen-active');
        penToolbar.classList.add('hidden');
        togglePenBtn.className = 'flex items-center space-x-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition touch-action-manipulation';
      }
    };

    closePenBtn.onclick = () => {
      isPenMode = false;
      canvas.classList.add('pointer-events-none');
      canvas.classList.remove('pen-active');
      penToolbar.classList.add('hidden');
      togglePenBtn.className = 'flex items-center space-x-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition touch-action-manipulation';
    };

    clearCanvasBtn.onclick = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    document.querySelectorAll('.pen-color-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.pen-color-btn').forEach(b => b.classList.remove('ring-blue-600', 'ring-red-500', 'ring-amber-500', 'ring-emerald-600'));
        penColor = btn.dataset.color;
        btn.classList.add('ring-offset-2');
        if (penColor === '#ef4444') btn.classList.add('ring-red-500');
        else if (penColor === '#2563eb') btn.classList.add('ring-blue-600');
        else if (penColor === '#f59e0b') btn.classList.add('ring-amber-500');
        else if (penColor === '#059669') btn.classList.add('ring-emerald-600');
      };
    });

    penSizeThin.onclick = () => {
      penLineWidth = 2;
      penSizeThin.className = 'px-2 py-1 text-xs rounded bg-blue-100 text-blue-700 font-bold';
      penSizeThick.className = 'px-2 py-1 text-xs rounded bg-slate-100 hover:bg-slate-200 font-bold';
    };

    penSizeThick.onclick = () => {
      penLineWidth = 6;
      penSizeThick.className = 'px-2 py-1 text-xs rounded bg-blue-100 text-blue-700 font-bold';
      penSizeThin.className = 'px-2 py-1 text-xs rounded bg-slate-100 hover:bg-slate-200 font-bold';
    };

    // Master Content Controller
    function renderContent() {
      renderHeader();
      if (currentSection === 'components') {
        renderComponentView();
      } else {
        renderPatternView();
      }
      resizeCanvas();
    }

    // Initialize on Page Load
    window.onload = function() {
      renderSidebar();
      renderContent();
      resizeCanvas();
    };
  </script>
</body>
</html>
